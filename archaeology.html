<style>
/* Layout: globe stage on the left with a curved timeline beneath it; story column on the right. Stacks on phones.
   Deliberately dark-only: the night setting is the design. */
:root{--night:#0E1822;--night2:#162634;--glow:#24394B;--cream:#F6EBD6;--text:#EFE6D3;--soft:#D2CABB;--muted:#A9B4B8;--amber:#E8B27A;--amber2:#F3C894;--red:#E07B6E;--line:rgba(239,230,211,.18);--chip:rgba(239,230,211,.08);
--serif:'Cormorant Garamond',Georgia,serif;--sans:'Instrument Sans',Arial,Helvetica,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--night);color:var(--text);font-family:var(--sans)}
body{min-height:100svh;background:radial-gradient(circle at 34% 46%,var(--glow) 0,var(--night2) 34%,var(--night) 70%) fixed}
button{font-family:var(--sans)}
button:focus-visible,select:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:20px 32px 0;padding-top:max(20px,env(safe-area-inset-top));flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{margin:0;font-family:var(--serif);font-weight:700;font-size:30px;line-height:1;color:var(--cream);letter-spacing:.3px}
.brand p{margin:2px 0 0;font:italic 600 17px var(--serif);color:var(--amber)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:relative}
.pill{height:44px;padding:0 18px;border-radius:999px;border:1px solid rgba(239,230,211,.28);background:rgba(239,230,211,.06);color:var(--text);font-size:14px;cursor:pointer}
.pill:hover{background:rgba(239,230,211,.12)}
a.pill{display:inline-flex;align-items:center;text-decoration:none}
.pill.quiz{border-color:#f2a65a;color:#f2a65a;background:rgba(242,166,90,.10);font-weight:600}.pill.quiz:hover{background:rgba(242,166,90,.2)}
.pill.quiz svg{margin-right:8px;flex:none}.pill:focus-visible{outline:2px solid #f2a65a;outline-offset:2px}
.primary{border:0;background:var(--amber);color:#1A1410;font-weight:600}
/* Play / Pause icons are drawn shapes, not text characters: iPhone and iPad turn the "play" character into a colored emoji. */
.ico{width:14px;height:14px;flex:none;fill:currentColor;stroke:currentColor;stroke-width:1.3;stroke-linejoin:round}
#play,#introPlay{display:inline-flex;align-items:center;justify-content:center;gap:7px}
.primary:hover{background:var(--amber2)}
.seg{display:flex;padding:4px;border-radius:999px;border:1px solid rgba(239,230,211,.28);background:rgba(14,24,34,.6)}
.seg button{height:36px;padding:0 14px;border:0;border-radius:999px;background:none;color:var(--soft);font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:rgba(239,230,211,.16);color:var(--cream);font-weight:600}
.key{position:absolute;right:0;top:54px;z-index:20;width:300px;padding:16px 18px;border-radius:18px;background:rgba(18,30,41,.96);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.5);display:grid;gap:10px;font-size:13px;color:var(--soft)}
.key h2{margin:0;font-family:var(--serif);font-size:20px;color:var(--cream)}
.key div{display:flex;gap:12px;align-items:center}
.key svg{flex:0 0 auto}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:12px;padding:0 32px 18px;align-items:start}
#stage{position:relative;height:calc(100svh - 110px);min-height:560px;max-height:980px}
#gl,#ov,#arc{position:absolute;inset:0;width:100%;height:100%}
#gl{filter:drop-shadow(0 40px 60px rgba(0,0,0,.55))}
#gl,#ov{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 36px,#000 calc(100% - 36px),transparent 100%),linear-gradient(180deg,transparent 0,#000 30px,#000 calc(100% - 30px),transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent 0,#000 36px,#000 calc(100% - 36px),transparent 100%),linear-gradient(180deg,transparent 0,#000 30px,#000 calc(100% - 30px),transparent 100%);mask-composite:intersect}
#ov{touch-action:none;cursor:grab}
#ov:active{cursor:grabbing}
#arc{pointer-events:none}

#stage{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.dot{fill:#1A1410;stroke:#FFF2DE;stroke-width:3}
.ring{fill:none;stroke:#FFF2DE;stroke-opacity:.7;stroke-width:1.5}
.anchor.uncertain .ring{stroke-dasharray:3 3}
.anchor,.route,.sym,.event{cursor:pointer}
.label{font-family:var(--sans);font-weight:600;fill:#1A1410;paint-order:stroke;stroke:#F6EBD6;stroke-width:4.5px;stroke-linejoin:round;pointer-events:none}
.routeShadow{fill:#000;opacity:.36;filter:url(#routeShadow)}
.routeBody{stroke:#FFF2DE;stroke-width:1.6;stroke-linejoin:round}
.kicker .kicon{display:inline-flex;vertical-align:middle;margin-left:10px}.kicker .kicon svg{display:block}
.routeBody.contested{fill-opacity:1;stroke:#2A2F33;stroke-width:2;stroke-dasharray:6 4}
.routeTrad{fill:#B9AE9A;stroke:#3F463F;stroke-width:1.8;stroke-dasharray:6 4;stroke-linejoin:round}
.coast{fill:none;stroke:#3B3326;stroke-opacity:.38;stroke-width:.9;stroke-linejoin:round;pointer-events:none}
.river{fill:none;stroke:#3F8AA3;stroke-opacity:.85;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.regionName{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:2.4px;fill:#4E4231;fill-opacity:.85;pointer-events:none}
.seaName{font-family:var(--serif);font-style:italic;font-size:15px;letter-spacing:1.2px;fill:#E4EEF0;fill-opacity:.9;pointer-events:none}
.route.selected .routeBody{stroke:#fff;stroke-width:3}
.route.selected{filter:drop-shadow(0 0 6px rgba(255,255,255,.65))}
.anchor.selected .dot{stroke:#fff;stroke-width:4.5}
.anchor.selected .ring{stroke:#fff;stroke-opacity:1;stroke-width:2.5}
.sym.selected{filter:drop-shadow(0 0 6px rgba(255,255,255,.8))}
.sym:focus{outline:none}.sym:focus-visible .symShape{stroke:#286D95;stroke-width:3}
.eventMark{fill:#F6EBD6;stroke:#1A1410;stroke-width:2}
.arcHalo{fill:none;stroke:rgba(14,24,34,.55);stroke-width:12;stroke-linecap:round}
.arcTrack{fill:none;stroke:rgba(239,230,211,.32);stroke-width:2}
.arcHit{fill:none;stroke:transparent;stroke-width:34}
.arcFill{fill:none;stroke:var(--amber);stroke-width:3.5;stroke-linecap:round}
.bead{fill:var(--amber);stroke:var(--night);stroke-width:4}
.notch{fill:rgba(239,230,211,.55)}
.notch:hover{fill:var(--amber)}
.tick{font-family:var(--sans);font-size:12.5px;fill:rgba(239,230,211,.78);paint-order:stroke;stroke:rgba(14,24,34,.6);stroke-width:2.5px;stroke-linejoin:round}

.arcSlider{position:absolute;left:50%;bottom:0;width:1px;height:1px;overflow:hidden;opacity:0}
.arcSlider:focus{left:auto;right:16px;bottom:16px;width:auto;height:auto;padding:8px 12px;opacity:1;border-radius:999px;background:rgba(14,24,34,.9);border:1px solid var(--amber);color:var(--cream);font-size:13px}
.nav{position:absolute;left:0;top:10px;display:flex;gap:6px;z-index:5}
.round{width:44px;height:44px;border-radius:50%;border:1px solid rgba(239,230,211,.28);background:rgba(14,24,34,.7);color:var(--text);font-size:20px;cursor:pointer;backdrop-filter:blur(6px)}

.prompt{padding:26px 28px;border-radius:24px;background:rgba(14,24,34,.86);border:1px solid var(--line);box-shadow:0 30px 70px rgba(0,0,0,.55);backdrop-filter:blur(10px);z-index:10;display:grid;gap:14px}

.year{font-family:var(--serif);font-style:italic;font-weight:600;font-size:112px;line-height:.85;letter-spacing:-3px;color:var(--cream);font-variant-numeric:lining-nums tabular-nums}

#stage{display:flex;flex-direction:column;min-height:300px;touch-action:auto}
/* Framed map (v0.8.x, CEO 10/19): the globe's sand-and-teal relief in a rounded card; no fade, no rings. */
#mapWrap{position:relative;flex:1 1 auto;min-height:0;overflow:visible;touch-action:none;cursor:grab;background:#4D6768;border:0;border-radius:26px;box-shadow:inset 0 0 0 1px rgba(246,235,214,.26),0 18px 50px rgba(0,0,0,.45)}
#map{clip-path:inset(0 round 26px)}
/* v0.8.x (CEO 10/19): the faint orbit rings are gone; the fade is a softer, rounder oval; the glow switches off while the map is being moved */

#map path{filter:drop-shadow(0 0 5px rgba(242,166,90,.5))}
#mapWrap.drag #map path,#mapWrap.zooming #map path{filter:none}
#map .river{stroke:#6FA3B3;stroke-width:1.5;opacity:.9;stroke-linecap:round;stroke-linejoin:round;filter:none}
#map .geoLbl{pointer-events:none}
#map .regionName{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:2.6px;fill:#5A4A36;fill-opacity:.8}
#map .seaName{font-family:var(--serif);font-style:italic;font-weight:600;font-size:15px;letter-spacing:1.2px;fill:#E6F0EF;fill-opacity:.92;paint-order:stroke;stroke:rgba(40,62,64,.55);stroke-width:2px}
.prompt .eyebrow{color:var(--amber)}
.prompt p.t{font-size:36px;line-height:1.05;font-weight:700;text-wrap:balance;letter-spacing:-.2px}
.prompt p.t em{font-style:italic;font-weight:600;color:var(--amber)}
.prompt p.t .sh{display:none}
@media (max-width:620px) and (orientation:portrait){.prompt p.t{font-size:23px}.prompt p.t .lg{display:none}.prompt p.t .sh{display:inline}}
#mapWrap.drag{cursor:grabbing}
#map{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-select:none}
.sel{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:7px;flex-wrap:wrap;z-index:5;pointer-events:none}
.sel>*{pointer-events:auto}
.sel .pill{height:36px;padding:0 14px;font-size:13px;background:rgba(14,24,34,.88);backdrop-filter:blur(4px)}
.sel .pill b{font-weight:600;color:var(--amber)}
.menu{position:absolute;z-index:9;min-width:210px;max-height:46vh;overflow:auto;padding:6px;border-radius:14px;background:rgba(18,30,41,.98);border:1px solid var(--line);box-shadow:0 14px 36px rgba(0,0,0,.5)}
.menu button{display:flex;width:100%;text-align:left;align-items:center;min-height:38px;padding:0 12px;border:0;border-radius:10px;background:none;font-size:14px;cursor:pointer;color:var(--text)}
.menu button:hover{background:rgba(239,230,211,.1)}
.menu button[aria-checked="true"]{color:var(--amber);font-weight:600}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:rgba(14,24,34,.88);z-index:5}
.zoom button{width:40px;height:38px;border:0;background:none;font-size:21px;cursor:pointer;color:var(--text)}
.zoom button+button{border-top:1px solid var(--line)}
.count{position:absolute;left:12px;bottom:8px;font-size:12px;color:var(--muted);z-index:4;pointer-events:none}
.tl{flex:none;position:relative;height:58px;margin-top:6px}
.tl input[type=range]{position:absolute;left:0;right:0;top:6px;width:100%;height:24px;margin:0;background:none;-webkit-appearance:none;appearance:none;touch-action:pan-x}
.tl input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:9px;background:rgba(239,230,211,.28)}
.tl input[type=range]::-moz-range-track{height:5px;border-radius:9px;background:rgba(239,230,211,.28)}
.tl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-10px;border-radius:50%;background:var(--amber);border:0;box-shadow:0 0 0 4px rgba(232,178,122,.3)}
.tl input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--amber);border:0;box-shadow:0 0 0 4px rgba(232,178,122,.3)}
.ticks{position:absolute;left:12px;right:12px;top:34px;height:22px}
.ticks button{position:absolute;transform:translateX(-50%);border:0;background:none;color:rgba(239,230,211,.78);font-size:12px;white-space:normal;width:76px;text-align:center;line-height:1.15;padding:3px 2px;cursor:pointer;top:0;font-family:var(--sans)}
.ticks button::before{content:'';position:absolute;left:50%;top:-5px;height:5px;border-left:1px solid var(--muted)}
.ticks button.cur{color:var(--amber);font-weight:700}
#story .chips{display:flex;flex-wrap:wrap;gap:8px}
#story .chips .chip.on{background:var(--amber);border-color:var(--amber);color:#1A1410;font-weight:600}
#story .tags{display:flex;flex-wrap:wrap;gap:8px}
#story .back{border:0;background:none;color:var(--amber);font-size:14px;font-weight:600;padding:0;text-align:left;cursor:pointer;min-height:28px}
#story .sub{font:italic 600 24px var(--serif);color:var(--amber);margin:-4px 0 0}
#story details{border-top:1px solid var(--line);padding-top:10px}
#story summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:32px}
#story summary::-webkit-details-marker{display:none}
#story summary::after{content:'\25B8';color:var(--amber)}
#story details[open] summary::after{content:'\25BE'}
#story details p{margin:8px 0 0;font-size:15px;line-height:1.55;color:var(--soft)}
#story .now{display:grid;gap:8px}
#story .now button{text-align:left;border:1px solid var(--line);background:var(--chip);border-radius:14px;padding:9px 13px;font-size:14px;cursor:pointer;color:var(--text)}
#story .now small{display:block;color:var(--muted);font-size:12px}
#story .soon{font-size:13px;color:var(--muted)}
.brand h1 a{color:inherit;text-decoration:none}
#panel.inviting #story{display:none}
#panel:not(.inviting) .prompt{display:none}
.layout{padding-top:12px}
.flow{animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-46}}
@media (max-width:620px) and (orientation:portrait){.ticks button{white-space:nowrap;width:auto}.ticks button:not(.cur){display:none}.tl{height:50px}#globeLink{display:none}#story .blk{flex:0 0 100%}#story .sub{font-size:20px;margin:0}#panel>#story{align-content:flex-start}.count{display:none}.sel{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.sel::-webkit-scrollbar{display:none}.sel .pill{flex:none}}
@media (max-width:900px){#stage{height:auto}}

/* ---- Archaeology page additions (everything above is the Movements stylesheet, copied so the two pages match) ---- */
#map path{filter:none}
.pin{cursor:pointer}.pin:focus{outline:none}
.pin:focus-visible .pinFocus{stroke:var(--cream);stroke-width:2;opacity:1}
.pinFocus{fill:none;stroke:none;opacity:0}
.pin.selected{filter:drop-shadow(0 0 7px rgba(255,255,255,.9))}
.pinRing{fill:none;stroke:var(--amber);stroke-width:2;opacity:.85;pointer-events:none}
.pinName{font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;fill:#2A2016;paint-order:stroke;stroke:#FBF3E4;stroke-opacity:.92;stroke-width:3.2px;stroke-linejoin:round;pointer-events:none;text-anchor:middle}
.ctl{display:grid;gap:12px}
.lens{align-self:start;justify-self:start}
.ctl .tl{height:62px;margin-top:0}
.ctl .tl input[type=range]{top:8px}
.ctl .ends{position:absolute;left:0;right:0;top:36px;display:flex;justify-content:space-between;font-size:12.5px;color:rgba(239,230,211,.78)}
.yrRow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.found{font-size:14px;color:var(--muted)}
.intro{position:absolute;inset:0;z-index:12;display:grid;place-items:center;padding:16px;border-radius:26px;background:rgba(10,18,26,.62);backdrop-filter:blur(2px)}
.intro .prompt{display:grid;gap:14px;max-width:440px;padding:24px 26px;background:rgba(14,24,34,.94)}
.intro .prompt p{font-size:22px;line-height:1.3}
.intro .prompt p.t{font-size:26px}
.intro[hidden]{display:none}
#panel.full>div:first-child::after{content:"Swipe down for the map \25BC"}
#story{align-content:start}
#story .found-at{font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--amber)}
#story .facts{display:grid;gap:4px;font-size:14px;color:var(--muted)}
#story .facts b{color:var(--soft);font-weight:600}
#story .shows{margin:0;padding:12px 14px;border-radius:14px;background:rgba(232,178,122,.1);font-size:14.5px;line-height:1.5;color:var(--soft)}
#story .shows em{font-family:var(--serif);font-size:18px;color:var(--amber);font-style:italic}
#story .links{display:flex;gap:10px 18px;flex-wrap:wrap}
#story .links a{color:var(--amber2);font-size:14px;min-height:32px;display:inline-flex;align-items:center}
#story .src{font-size:13px;color:var(--muted);line-height:1.5}
#story .src a{color:var(--amber2)}
#story .limits{margin-top:10px!important;color:var(--muted)!important}
.pinKey{display:flex;gap:12px;align-items:center}
.pinKey svg{flex:0 0 auto}
.empty{font-size:16px;line-height:1.55;color:var(--soft)}
@media (max-width:900px){.ctl .tl{margin-top:0}}
@media (max-width:620px) and (orientation:portrait){
 #panel>.ctl{flex:none;padding:6px 0 4px}
 .intro .prompt{padding:18px 20px}.intro .prompt p{font-size:18px}.intro .prompt p.t{font-size:22px}
 #story .found-at{flex:0 0 100%}#story .facts,#story .shows,#story .links,#story .src{flex:0 0 100%}
}
@media (min-width:901px) and (orientation:landscape) and (max-height:1100px){#panel>.ctl{flex:none}}

/* ---- v2.0.2 "Side card" layout (CEO pick 10/21, comp 1): the map is the page. A find is open in a floating card with carousel dots; year and slider float along the bottom; Map key sits top left of the map. ---- */
body.arc .layout{display:block;padding:12px 24px 8px}
html.nav-glass body.arc #stage{height:calc(100svh - 196px)}
body.arc #stage{position:relative;display:flex;flex-direction:column;height:calc(100svh - 212px);min-height:480px;max-height:980px;touch-action:auto}
body.arc #mapWrap{flex:1 1 auto;min-height:0}
.keybtn{position:absolute;left:12px;top:12px;z-index:8;height:44px;padding:0 16px;display:flex;align-items:center;gap:8px;border-radius:999px;border:1px solid rgba(239,230,211,.3);background:rgba(14,24,34,.9);color:var(--text);font-size:14px;font-weight:600;cursor:pointer}
.keybtn:hover{background:rgba(24,38,52,.95)}
body.arc .key{left:12px;right:auto;top:64px;width:240px;z-index:9}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:14px;z-index:7;padding:8px 14px;border-radius:999px;background:rgba(14,24,34,.9);border:1px solid rgba(232,178,122,.5);font-size:13px;font-weight:500;color:var(--amber2);white-space:nowrap;pointer-events:none;max-width:calc(100% - 330px);overflow:hidden;text-overflow:ellipsis}
.hint:empty{display:none}
body.arc .zoom{right:12px;bottom:12px;z-index:7}
body.arc .zoom button{width:44px;height:44px}
#card{position:absolute;right:12px;top:12px;width:360px;max-height:calc(100% - 150px);z-index:8;display:flex;flex-direction:column;border-radius:20px;background:rgba(14,24,34,.93);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);overflow:hidden}
body.arc #story,body.arc #story.pinned{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:thin;padding:18px 18px 12px;border:0;border-radius:0;background:none;box-shadow:none;display:grid;gap:10px;align-content:start;position:relative}
body.arc #story h2{font-size:32px;padding-right:84px}
body.arc #story .sub{font-size:20px;margin:-2px 0 0}
body.arc #story #storyText{font-size:15.5px;line-height:1.55}
body.arc .kicker,body.arc #story .found-at{padding-right:84px}
body.arc #story>.ojj-share,body.arc #story>.shareSlot{top:10px;right:56px}
body.arc #closeStory{right:14px;top:14px;width:36px;height:36px;font-size:18px;line-height:1;padding:0}
.more{display:none}
.tbar{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;width:min(720px,calc(100% - 190px));z-index:8;padding:10px 20px 4px;border-radius:20px;background:rgba(14,24,34,.92);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.yrRow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.yrBox{display:flex;align-items:baseline;gap:10px;min-width:0}
body.arc .tbar .year{font-size:32px;line-height:1;letter-spacing:-1px}
body.arc .tbar .year span{font-size:15px;margin-left:6px;letter-spacing:1px}
body.arc .tbar .era{font-size:13px;color:var(--muted);min-height:0;white-space:nowrap}
body.arc .tbar .ctl{display:block}
body.arc .tbar .ctl .tl{height:46px;margin-top:0}
body.arc .tbar .ctl .tl input[type=range]{top:4px}
body.arc .tbar .ctl .ends{top:30px}
@media (max-width:900px){
 html.nav-glass body.arc #stage{height:auto}
 html,body{height:100%;overflow:hidden}
 body.arc{display:flex;flex-direction:column;height:100svh;min-height:0}
 body.arc .layout{flex:1;min-height:0;display:flex;flex-direction:column;padding:6px 16px 0}
 body.arc #stage{flex:1 1 auto;height:auto;min-height:0;max-height:none}
 .hint{left:12px;top:64px;transform:none;max-width:calc(100% - 76px);font-size:12px;padding:6px 11px}
 body.arc .zoom{top:12px;bottom:auto}
 body.arc .keybtn{height:40px;padding:0 13px}
 #card{left:10px;right:auto;top:auto;bottom:calc(var(--tb,100px) + 18px);width:min(560px,calc(100% - 20px));max-height:calc(100% - var(--tb,100px) - 90px)}
 body.arc #story,body.arc #story.pinned{padding:14px 16px 8px}
 body.arc #story h2{font-size:26px;padding-right:80px;flex:none}
 body.arc #story .sub{font-size:17px}
 body.arc #story #storyText{font-size:14.5px;line-height:1.5}
 #card:not(.open) #storyText{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
 #card:not(.open) #story .shows,#card:not(.open) #story .links,#card:not(.open) #story .src,#card:not(.open) #story details,#card:not(.open) #story .where{display:none}
 #card.open{max-height:calc(100% - var(--tb,100px) - 90px)}
 .more{display:inline-flex;align-items:center;min-height:36px;border:0;background:none;color:var(--amber2);font-size:14px;font-weight:600;padding:0;cursor:pointer;justify-self:start}
 body.arc .tbar{position:static;transform:none;width:auto;margin:8px 0 0;padding:8px 14px 2px;box-shadow:none}
 body.arc .tbar .year{font-size:28px}
 body.arc .seg button{height:30px;padding:0 9px;font-size:12px}
 body.arc .foot{padding:6px 16px;padding-bottom:max(6px,env(safe-area-inset-bottom))}body.arc .foot>span:first-child{display:none}
}
@media (max-width:900px) and (max-height:700px){#card:not(.open) #story .facts,#card:not(.open) #storyText{display:none}}
@media (max-width:900px) and (max-height:680px){#card:not(.open) #story .sub{display:none}}
@media (max-width:380px){body.arc .seg button{padding:0 7px;font-size:11.5px;height:28px}body.arc .tbar{padding:6px 12px 0}.yrRow{flex-wrap:nowrap}body.arc .tbar .year{font-size:24px}body.arc #story h2{font-size:23px}.kicker,body.arc #story .found-at{font-size:11.5px;letter-spacing:1.4px}}
@media (max-width:620px){body.arc .brand h1{font-size:22px}body.arc .brand p{font-size:13px}body.arc .top{padding:6px 16px 4px}body.arc .tbar .era{display:none}}
</style>
</head>
<body class="arc">
<header class="top">
<div class="brand"><h1>Found in the Ground</h1><p>Real objects. Real places. Real dates.</p></div>
</header>
<main class="layout">
<section id="stage" aria-label="Map of archaeological finds">
<div id="mapWrap">
<svg id="map" role="group" aria-label="Flat map of archaeological finds. Drag to move it; pinch or scroll to zoom. Tap a pin to read about it."></svg>
</div>
<button type="button" class="keybtn" id="keyBtn" aria-expanded="false" aria-controls="key"></button>
<div class="key" id="key" hidden></div>
<div class="hint" id="hint"></div>
<div class="zoom"><button type="button" id="zin" aria-label="Zoom in">+</button><button type="button" id="zout" aria-label="Zoom out">&minus;</button></div>
<aside id="card" aria-label="Find">
<article id="story"></article>
</aside>
<div id="tbar" class="tbar">
<div class="yrRow"><div class="yrBox"><div class="year" id="year"></div><div class="era" id="era"></div></div>
<div class="seg lens" id="lens" role="group" aria-label="Which date to follow"><button type="button" data-lens="found" aria-pressed="true">Discovery year</button><button type="button" data-lens="period" aria-pressed="false">Item&rsquo;s period</button></div></div>
<div class="ctl" id="ctl"><div class="tl"><input type="range" id="slider" min="0" max="1000" value="0" aria-label="Year"><div class="ends" id="ends"></div></div></div>
</div>
<div class="intro" id="intro" role="dialog" aria-modal="true" aria-labelledby="introText">
<div class="prompt"><p id="introText">Archaeologists keep finding Jewish history: inscriptions, synagogues, scrolls and tombs. Slide through the years and see when each was found.</p>
<div class="row"><button type="button" class="pill primary" id="begin">Begin the dig</button></div></div>
</div>
</section>
</main>
<footer class="foot"><span>Drag the map to move it &middot; pinch or scroll to zoom</span><span class="footR"><span id="version"></span></span></footer>
<script src="version.js"></script>
<script src="share.js"></script>
<script src="pager.js"></script>
<script src="mapinset.js"></script>
<script src="archaeology.js"></script>
<script src="nav.js"></script>
<script src="pill.js"></script>
<script src="header.js"></script>
</body>
</html>
